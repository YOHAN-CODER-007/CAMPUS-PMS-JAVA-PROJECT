# ===================================================================
# Campus Placement Management System - Application Configuration
# ===================================================================

# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=

# Application Name
spring.application.name=Campus-PMS

# -------------------------------------------------------------------
# Database Configuration (MySQL)
# Default username/password configured for local machine.
# Override easily via Environment variables:
#   SPRING_DATASOURCE_USERNAME
#   SPRING_DATASOURCE_PASSWORD
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/placement_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:yohan}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------------------------------------------------
# File Upload Configuration (Max 2MB per prompt requirements)
# -------------------------------------------------------------------
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.enabled=true

# Custom File Storage Directory for Student Resumes
file.upload-dir=uploads/resumes

# -------------------------------------------------------------------
# Thymeleaf Configuration
# -------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Logging
logging.level.com.placement=INFO
logging.level.org.springframework.security=WARN
