<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Notifications - Campus PMS')}"></head>
<body>

<div class="app-wrapper">
    <div class="sidebar-backdrop"></div>
    <!-- Dynamically active sidebar by role -->
    <aside sec:authorize="hasRole('STUDENT')" th:replace="~{fragments/layout :: sidebar('')}"></aside>
    <aside sec:authorize="hasRole('COMPANY')" th:replace="~{fragments/layout :: sidebar('')}"></aside>
    <aside sec:authorize="hasRole('OFFICER')" th:replace="~{fragments/layout :: sidebar('')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: navbar('System Notifications')}"></header>

        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
                <div>
                    <h3 class="fw-bold mb-1">Your Notifications</h3>
                    <p class="text-muted small mb-0">Stay informed about application updates, interview schedules, and placement officer notices.</p>
                </div>
                <form th:action="@{/notifications/mark-all-read}" method="post">
                    <button type="submit" class="btn btn-sm btn-outline-primary rounded-pill px-3">
                        <i class="bi bi-check2-all me-1"></i> Mark All as Read
                    </button>
                </form>
            </div>

            <div class="custom-card">
                <div class="p-4">
                    <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5 text-muted">
                        <i class="bi bi-bell-slash fs-1 d-block mb-2 opacity-50"></i>
                        <span>You have no notifications at this time.</span>
                    </div>

                    <div th:unless="${#lists.isEmpty(notifications)}" class="d-flex flex-column gap-3">
                        <div th:each="n : ${notifications}" class="p-3 rounded-3 border d-flex justify-content-between align-items-center"
                             th:classappend="${!n.read} ? 'bg-primary-subtle border-primary-subtle' : 'bg-body-tertiary'">
                            <div class="d-flex align-items-start gap-3">
                                <div class="rounded-circle p-2 mt-1"
                                     th:classappend="${!n.read} ? 'bg-primary text-white' : 'bg-secondary text-white'"
                                     style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem;">
                                    <i class="bi bi-bell-fill"></i>
                                </div>
                                <div>
                                    <p class="mb-1" th:classappend="${!n.read} ? 'fw-bold' : ''" th:text="${n.message}">Notification message</p>
                                    <span class="small text-muted" th:text="${#temporals.format(n.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</span>
                                </div>
                            </div>
                            <span th:if="${!n.read}" class="badge bg-primary rounded-pill px-2 py-1 small">New</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
