<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Announcements - Placement Officer')}"></head>
<body>

<div class="app-wrapper">
    <div class="sidebar-backdrop"></div>
    <aside th:replace="~{fragments/layout :: sidebar('announcements')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/layout :: navbar('Announcements & Bulletins')}"></header>

        <main class="app-content">
            <div th:replace="~{fragments/layout :: alerts}"></div>

            <div class="row g-4">
                <!-- Post Announcement Form -->
                <div class="col-lg-5">
                    <div class="custom-card">
                        <div class="card-header-clean">
                            <h5><i class="bi bi-broadcast text-primary me-2"></i>Post New Announcement</h5>
                        </div>
                        <div class="p-4">
                            <form th:action="@{/officer/announcements}" method="post">
                                <div class="mb-3">
                                    <label for="title" class="form-label fw-semibold small">Notice Title <span class="text-danger">*</span></label>
                                    <input type="text" id="title" name="title" class="form-control"
                                           placeholder="e.g. Upcoming TCS Drive Guidelines" required>
                                </div>
                                <div class="mb-3">
                                    <label for="message" class="form-label fw-semibold small">Announcement Message <span class="text-danger">*</span></label>
                                    <textarea id="message" name="message" class="form-control" rows="5"
                                              placeholder="Provide full instructions, venue details, reporting time, and mandatory documents..." required></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary-custom w-100 py-2">
                                    <i class="bi bi-send-fill me-1"></i> Broadcast Announcement
                                </button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Announcements History -->
                <div class="col-lg-7">
                    <div class="custom-card">
                        <div class="card-header-clean">
                            <h5><i class="bi bi-list-stars text-primary me-2"></i>Published Bulletins</h5>
                            <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1" th:text="${#lists.size(announcements) + ' posted'}">0</span>
                        </div>
                        <div class="p-4">
                            <div th:if="${#lists.isEmpty(announcements)}" class="text-center py-5 text-muted">
                                <i class="bi bi-megaphone fs-1 d-block mb-2 opacity-50"></i>
                                <span>No announcements published yet. Post your first bulletin on the left!</span>
                            </div>

                            <div th:unless="${#lists.isEmpty(announcements)}" class="d-flex flex-column gap-3">
                                <div th:each="ann : ${announcements}" class="p-3 rounded-3 bg-body-tertiary border-start border-4 border-primary position-relative">
                                    <div class="d-flex justify-content-between align-items-center mb-1 flex-wrap gap-2">
                                        <h6 class="fw-bold mb-0" th:text="${ann.title}">Announcement Title</h6>
                                        <div class="d-flex align-items-center gap-2">
                                            <span class="small text-muted" th:text="${#temporals.format(ann.createdAt, 'dd MMM yyyy, hh:mm a')}">Date</span>
                                            <form th:action="@{'/officer/announcements/' + ${ann.id} + '/delete'}" method="post" class="d-inline"
                                                  th:data-ann-title="${ann.title}"
                                                  onsubmit="return confirm('Are you sure you want to remove announcement \'' + this.getAttribute('data-ann-title') + '\'?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger rounded-pill px-2 py-0"
                                                        title="Remove / Expire Announcement">
                                                    <i class="bi bi-trash3 me-1"></i>Remove
                                                </button>
                                            </form>
                                        </div>
                                    </div>
                                    <p class="text-muted small mb-0" th:text="${ann.message}">Message body</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
